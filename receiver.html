<style>

<script type="module">
import { initCimbar } from './index.js';

const t = window.__t;

const TYPE_FILE = 0, TYPE_TEXT = 1, TYPE_IMAGE = 2;
const TYPE_MIME = { 0: 'application/octet-stream', 1: 'text/plain;charset=utf-8', 2: 'image/jpeg' };
function typeLabel(type) {
  return type === TYPE_TEXT ? t('typeText') : type === TYPE_IMAGE ? t('typeImage') : t('typeFile');
}
function isValidType(type) { return type >= TYPE_FILE && type <= TYPE_IMAGE; }

const video = document.getElementById('video');
const scanCanvas = document.getElementById('scan');
const btnScan = document.getElementById('btnScan');
const btnStop = document.getElementById('btnStop');
const alignEl = document.getElementById('align');
const progressBar = document.getElementById('progressBar');
const metaEl = document.getElementById('meta');
const errEl = document.getElementById('err');
const resultEl = document.getElementById('result');
const historyList = document.getElementById('historyList');

const Cimbar = {};
let decoder = null;
let scanning = false;
let streamRef = null, scanRaf = 0, lastDecodeAt = 0;
let lastRec = null;          // 最近一次接收结果（语言切换时重绘）
let metaKey = null, metaVars = null;
let alignKey = null, alignOk = null;

function absUrl(p) { return new URL(p, location.href).href; }
function showErr(msg) { errEl.style.display = 'block'; errEl.textContent = msg; }
function hideErr() { errEl.style.display = 'none'; }
function setMeta(key, vars) { metaKey = key; metaVars = vars || null; metaEl.textContent = t(key, vars); }
function setAlign(key, ok) { alignKey = key; alignOk = ok || null; alignEl.className = ok ? 'ok' : (ok === false ? 'bad' : ''); alignEl.textContent = t(key); }
function fmtSize(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1024).toFixed(1) + ' KB'; }
function fmtTime(t) {
  const d = new Date(t);
  const p = (x) => (x < 10 ? '0' : '') + x;
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function safeName(n) {
  return String(n || 'received').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').slice(0, 200) || 'received';
}

/* ---------- CTXF v2 解析（13B 头 + name + [meta 12B] + payload） ----------
   v1：magic + ver=1 + type + flags + nameLen + payloadLen + name + payload
   v2：同上，flags bit0=1 时 name 后有 meta：seq LE32 + total LE32 + origSize LE32 */
function parseTransfer(u8) {
  if (u8.length < 13) return null;
  const magic = String.fromCharCode(u8[0], u8[1], u8[2], u8[3]);
  if (magic !== 'CTXF') return null;
  const ver = u8[4];
  if (ver !== 1 && ver !== 2) return null;
  const type = u8[5];
  const flags = u8[6];
  const nameLen = u8[7] | (u8[8] << 8);
  const plen = (u8[9] | (u8[10] << 8) | (u8[11] << 16) | (u8[12] << 24)) >>> 0;
  const hasMeta = (ver === 2 && (flags & 1) === 1) ? 12 : 0;
  if (13 + nameLen + hasMeta + plen !== u8.length) return null;
  const name = new TextDecoder().decode(u8.subarray(13, 13 + nameLen));
  const metaStart = 13 + nameLen;
  let seq = 0, total = 1, origSize = plen;
  if (hasMeta) {
    seq = (u8[metaStart] | (u8[metaStart + 1] << 8) | (u8[metaStart + 2] << 16) | (u8[metaStart + 3] << 24)) >>> 0;
    total = (u8[metaStart + 4] | (u8[metaStart + 5] << 8) | (u8[metaStart + 6] << 16) | (u8[metaStart + 7] << 24)) >>> 0;
    origSize = (u8[metaStart + 8] | (u8[metaStart + 9] << 8) | (u8[metaStart + 10] << 16) | (u8[metaStart + 11] << 24)) >>> 0;
  }
  const payload = u8.subarray(metaStart + hasMeta);
  return { ver, type, name, payload, seq, total, origSize };
}

/* ---------- 接收完成 ---------- */
function handleSuccess(data) {
  const u8 = data instanceof Uint8Array ? data : new Uint8Array(data);
  const parsed = parseTransfer(u8);
  if (parsed && parsed.type === TYPE_FILE && parsed.total > 1) {
    // 分段传输：存入 IndexedDB 续传，扫描保持继续等待下一段
    handleSegment(parsed).catch((e) => {
      console.warn('segment store failed:', e);
      showErr(t('segStoreFail'));
    });
    return;
  }
  let rec;
  if (parsed) {
    // 发送端对小载荷做了 padding（≥1KB 保证帧可解），v2 meta 的 origSize 为真实长度，
    // 必须按 origSize 截断，否则文本/图片会混入填充字节。
    const raw = parsed.payload;
    const effLen = (parsed.origSize && parsed.origSize > 0 && parsed.origSize < raw.length) ? parsed.origSize : raw.length;
    rec = {
      name: safeName(parsed.name),
      type: isValidType(parsed.type) ? parsed.type : TYPE_FILE,
      size: effLen,
      blob: new Blob([raw.slice(0, effLen)], { type: TYPE_MIME[isValidType(parsed.type) ? parsed.type : 0] }),
    };
  } else {
    // 兼容：旧版无 CTXF 头的原始数据流（如官方 cimbar.org）
    rec = { name: 'received.bin', type: TYPE_FILE, size: u8.length, blob: new Blob([u8]) };
    showErr(t('noHeaderNote'));
  }
  lastRec = rec;
  renderResult(rec);
  saveToDB(rec);
  setScanState(false);
  setMeta('recvDone', { name: rec.name, size: fmtSize(rec.size) });
  rebuildDecoder();   // 完成一次传输后重建，支持连续接收下一个文件
}

/* ---------- 分段续传 ---------- */
async function handleSegment(parsed) {
  const name = safeName(parsed.name);
  let rec = await getTransfer(name);
  if (!rec) {
    rec = { name, origSize: parsed.origSize || 0, total: parsed.total, chunks: {}, time: Date.now() };
  }
  if (!rec.chunks[parsed.seq]) {
    rec.chunks[parsed.seq] = new Blob([parsed.payload], { type: 'application/octet-stream' });
    rec.total = parsed.total;
    rec.origSize = parsed.origSize || rec.origSize;
    await putTransfer(rec);
  }
  refreshActiveTransfers();
  const got = Object.keys(rec.chunks).length;
  if (got >= rec.total) {
    const parts = [];
    for (let i = 0; i < rec.total; i++) {
      if (rec.chunks[i]) parts.push(rec.chunks[i]);
    }
    const blob = new Blob(parts, { type: TYPE_MIME[TYPE_FILE] });
    await deleteTransfer(name);
    const done = { name, type: TYPE_FILE, size: rec.origSize || blob.size, blob };
    lastRec = done;
    renderResult(done);
    saveToDB(done);
    refreshActiveTransfers();
    setMeta('segDone', { name, size: fmtSize(done.size), total: rec.total });
    setScanState(false);
    rebuildDecoder();   // 完成一次传输后重建，支持连续接收下一个文件
  } else {
    setMeta('segProgress', { name, got, total: rec.total });
  }
}

function renderResult(rec) {
  resultEl.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'card';

  const tp = document.createElement('div');
  tp.className = 'type';
  tp.textContent = typeLabel(rec.type);
  const n = document.createElement('div');
  n.className = 'name';
  n.textContent = rec.name;
  const s = document.createElement('div');
  s.className = 'size';
  s.textContent = fmtSize(rec.size);
  card.appendChild(tp); card.appendChild(n); card.appendChild(s);

  const url = URL.createObjectURL(rec.blob);

  if (rec.type === TYPE_TEXT) {
    const pre = document.createElement('pre');
    rec.blob.text().then((txt) => { pre.textContent = txt; }).catch(() => { pre.textContent = t('decodeFail'); });
    card.appendChild(pre);
    const acts = document.createElement('div');
    acts.className = 'acts';
    const copy = document.createElement('button');
    copy.textContent = t('copyText');
    copy.addEventListener('click', () => {
      rec.blob.text().then((txt) => {
        (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject(new Error('no clipboard')))
          .then(() => { copy.textContent = t('copied'); })
          .catch(() => {
            const ta = document.createElement('textarea');
            ta.value = txt; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); copy.textContent = t('copied'); } catch (e) { copy.textContent = t('copyFail'); }
            document.body.removeChild(ta);
          });
      });
    });
    acts.appendChild(copy);
    card.appendChild(acts);
  } else if (rec.type === TYPE_IMAGE) {
    const img = document.createElement('img');
    img.className = 'preview';
    img.src = url;
    card.appendChild(img);
    const acts = document.createElement('div');
    acts.className = 'acts';
    const dl = document.createElement('a');
    dl.className = 'btn';
    dl.href = url;
    dl.download = rec.name;
    dl.textContent = t('saveImage');
    acts.appendChild(dl);
    card.appendChild(acts);
  } else {
    const acts = document.createElement('div');
    acts.className = 'acts';
    const dl = document.createElement('a');
    dl.className = 'btn primary';
    dl.href = url;
    dl.download = rec.name;
    dl.textContent = t('saveFile');
    acts.appendChild(dl);
    card.appendChild(acts);
  }
  resultEl.appendChild(card);
}

/* ---------- IndexedDB v2：历史记录 + 分段续传 ---------- */
let db = null;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('ctxfer', 2);
    r.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('items')) {
        d.createObjectStore('items', { keyPath: 'id', autoIncrement: true });
      }
      if (!d.objectStoreNames.contains('transfers')) {
        d.createObjectStore('transfers', { keyPath: 'name' });
      }
    };
    r.onsuccess = (e) => res(e.target.result);
    r.onerror = (e) => rej(e.target.error);
  });
}
async function getTransfer(name) {
  if (!db) db = await openDB();
  return new Promise((res, rej) => {
    const r = db.transaction('transfers', 'readonly').objectStore('transfers').get(name);
    r.onsuccess = () => res(r.result || null);
    r.onerror = () => rej(r.error);
  });
}
async function putTransfer(rec) {
  if (!db) db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('transfers', 'readwrite');
    tx.objectStore('transfers').put(rec);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function deleteTransfer(name) {
  if (!db) db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('transfers', 'readwrite');
    tx.objectStore('transfers').delete(name);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function listTransfers() {
  if (!db) db = await openDB();
  return new Promise((res, rej) => {
    const r = db.transaction('transfers', 'readonly').objectStore('transfers').getAll();
    r.onsuccess = () => res(r.result || []);
    r.onerror = () => rej(r.error);
  });
}
async function refreshActiveTransfers() {
  try {
    if (!db) db = await openDB();
    const list = await listTransfers();
    const wrap = document.getElementById('activeTransfers');
    const ul = document.getElementById('activeList');
    if (!list || !list.length) { if (wrap) wrap.hidden = true; return; }
    if (wrap) wrap.hidden = false;
    ul.innerHTML = '';
    for (const tr of list) {
      const got = Object.keys(tr.chunks || {}).length;
      const li = document.createElement('li');
      const n = document.createElement('span');
      n.className = 'h-name';
      n.textContent = tr.name;
      const m = document.createElement('span');
      m.className = 'h-meta';
      m.textContent = t('segProgress', { got, total: tr.total });
      li.appendChild(n);
      li.appendChild(m);
      const bar = document.createElement('div');
      bar.className = 'minibar';
      const fill = document.createElement('div');
      fill.className = 'minibar-fill';
      fill.style.width = Math.round(got / Math.max(1, tr.total) * 100) + '%';
      bar.appendChild(fill);
      li.appendChild(bar);
      ul.appendChild(li);
    }
  } catch (e) { console.warn('active transfers list failed:', e); }
}
async function saveToDB(rec) {
  try {
    if (!db) db = await openDB();
    const tx = db.transaction('items', 'readwrite');
    tx.objectStore('items').add({ name: rec.name, type: rec.type, size: rec.size, time: Date.now(), blob: rec.blob });
  } catch (e) { console.warn('IndexedDB 保存失败（可能处于隐私模式）:', e); }
  refreshList();
}
async function refreshList() {
  try {
    if (!db) db = await openDB();
    const all = await new Promise((res, rej) => {
      const r = db.transaction('items', 'readonly').objectStore('items').getAll();
      r.onsuccess = () => res(r.result || []);
      r.onerror = () => rej(r.error);
    });
    historyList.innerHTML = '';
    const sorted = all.slice().sort((a, b) => (b.time || 0) - (a.time || 0));
    for (const it of sorted) {
      const li = document.createElement('li');
      const n = document.createElement('span');
      n.className = 'h-name';
      n.textContent = it.name;
      const m = document.createElement('span');
      m.className = 'h-meta';
      m.textContent = typeLabel(it.type) + ' · ' + fmtSize(it.size) + ' · ' + fmtTime(it.time);
      const dl = document.createElement('a');
      dl.className = 'btn';
      dl.href = URL.createObjectURL(it.blob);
      dl.download = it.name;
      dl.textContent = t('download');
      const del = document.createElement('button');
      del.textContent = t('delete');
      del.addEventListener('click', () => {
        const tx = db.transaction('items', 'readwrite');
        tx.objectStore('items').delete(it.id);
        refreshList();
      });
      li.appendChild(n); li.appendChild(m); li.appendChild(dl); li.appendChild(del);
      historyList.appendChild(li);
    }
  } catch (e) { console.warn('读取历史失败:', e); }
}

/* ---------- 主线程解码器（不依赖 Worker：wasm 在主线程直接解码） ----------
   完整复刻官方解码链：_decodeImage 产出模板分片 → 写入 /temp → _write_frame_data 喂给汇流器
   → _get_common_progress 轮询 → 进度归零时从 /out 读出完整数据流（含 CTXF 头）。 */
function createMTDecoder(C) {
  const numBytes = 32;
  const templatePtah = '/temp';
  const templateDir = '/template_data/';
  const outputDir = '/out/';
  function mk(p) { try { C.FS.mkdir(p); } catch (e) {} }
  mk(templateDir); mk(outputDir);
  // 注意：/temp 是文件（官方 worker 里 FS.writeFile('/temp', data) 直接覆盖写），不是目录
  function createPathHeap(p) {
    const ptr = C._malloc(numBytes);
    const bytes = new Uint8Array(C.HEAPU8.buffer, ptr, numBytes);
    bytes.fill(0);
    for (let k = 0; k < p.length; k++) bytes[k] = p.charCodeAt(k);
    return ptr;
  }
  const templateHeap = createPathHeap(templatePtah);
  const outputHeap = createPathHeap(outputDir);
  // init_sink 偶发返回 -1（wasm 参数校验偶发判定为 null）。用裸指针并校验返回值，失败则换参数序重试。
  let sinkReady = false;
  const sinkRetry = [
    () => C._init_sink(outputHeap, numBytes),
    () => C._init_sink(outputHeap),
    () => C._init_sink(numBytes, outputHeap),
  ];
  for (let i = 0; i < sinkRetry.length && !sinkReady; i++) {
    try {
      const r = sinkRetry[i]();
      if (r === 1) sinkReady = true;
    } catch (e) { /* 继续尝试 */ }
  }
  if (!sinkReady) {
    try { C._init_sink(outputHeap, numBytes); } catch (e) {}
  }
  let onData = null, onDecodeError = null;
  const api = {
    setCallbacks(cb) { onData = cb.onData || null; onDecodeError = cb.onDecodeError || null; },
    lastErr: 0, lastTpls: 0,
    getProgress() { const p = C._get_common_progress(); return p === 0 ? 1 : p; },
    rawProgress() { return C._get_common_progress(); },
    outEntries() { try { return C.FS.readdir(outputDir); } catch (e) { return ['ERR ' + e.message]; } },
    // 调试对照：与 decodeFrame 同参数的"直调"，不吞错，返回各步状态
    decodeDirect(imgData) {
      const data = imgData.data;
      const Q = C._malloc(data.length);
      const Z = new Uint8Array(C.HEAPU8.buffer, Q, data.length);
      for (let i = 0; i < data.length; i += 4) {
        Z[i] = data[i + 2]; Z[i + 1] = data[i + 1]; Z[i + 2] = data[i]; Z[i + 3] = data[i + 3];
      }
      const err = C._decodeImage(Q, imgData.width, imgData.height, outputHeap, numBytes);
      C._free(Q);
      let tpls = [];
      try {
        const names = C.FS.readdir(templateDir);
        for (let i = 0; i < names.length; i++) {
          const n = names[i];
          if (n !== '.' && n !== '..') tpls.push(C.FS.readFile(templateDir + n).length);
        }
      } catch (e) { return { err, tpls: 'FS-ERR ' + e.message, progress: -1 }; }
      if (tpls.length) {
        const names = C.FS.readdir(templateDir);
        for (let i = 0; i < names.length; i++) {
          const n = names[i];
          if (n !== '.' && n !== '..') {
            const t = C.FS.readFile(templateDir + n);
            C.FS.writeFile(templatePtah, t);
            C._write_frame_data(templateHeap);
          }
        }
      }
      const p = C._get_common_progress();
      return { err: err, tpls: tpls, progress: p };
    },
    decodeFrame(imgData) {
      const data = imgData.data;
      const Q = C._malloc(data.length);
      const Z = new Uint8Array(C.HEAPU8.buffer, Q, data.length);
      // 与官方 worker 相同：RGBA → BGRA（wasm 期望 BGR 通道序）
      for (let i = 0; i < data.length; i += 4) {
        Z[i] = data[i + 2];
        Z[i + 1] = data[i + 1];
        Z[i + 2] = data[i];
        Z[i + 3] = data[i + 3];
      }
      let err = 0;
      try { err = C._decodeImage(Q, imgData.width, imgData.height, outputHeap, numBytes); }
      catch (e) { C._free(Q); if (onDecodeError) onDecodeError(-1); return; }
      C._free(Q);
      api.lastErr = err;
      // 重要：err≠0 不代表帧无效。实测 qt-works 解码器对"识别成功但
      // 无新块/帧重复"也返回非 0 错误码，此时模板目录可能仍有有效输出；
      // 直接丢弃会永远收不到数据。因此一律先读取模板目录，有输出才写入。
      let files = [];
      const names = C.FS.readdir(templateDir);
      for (let i = 0; i < names.length; i++) {
        const n = names[i];
        if (n !== '.' && n !== '..') files.push(C.FS.readFile(templateDir + n));
      }
      api.lastTpls = files.length;
      for (let i = 0; i < names.length; i++) {
        const n = names[i];
        if (n !== '.' && n !== '..') { try { C.FS.unlink(templateDir + n); } catch (e) {} }
      }
      if (!files.length) {
        // 模板目录为空且解码返回错误，才视为帧无效
        if (err !== 0) { if (onDecodeError) onDecodeError(err); }
        return;
      }
      for (let i = 0; i < files.length; i++) {
        C.FS.writeFile(templatePtah, files[i]);
        C._write_frame_data(templateHeap);
      }
      const p = C._get_common_progress();
      if (p === 0) {
        const entries = C.FS.readdir(outputDir);
        if (entries.length === 3) {
          const outName = entries[2];
          const out = C.FS.readFile(outputDir + '/' + outName);
          try { C.FS.unlink(outputDir + '/' + outName); } catch (e) {}
          if (onData) onData(out);
        }
      }
    }
  };
  return api;
}

/* 传输完成后重建解码器：官方 worker 每次传输用独立实例，
   同一 wasm sink 在完成一次传输后不接受新流（实测确认）。 */
function bindDecoder(d) {
  d.setCallbacks({
    onData: (data) => handleSuccess(data),
    onDecodeError: (code) => {
      setAlign('alignBad', false);
      if (code !== -1) showErr(t('decodeErr', { code: code }));
    },
  });
}
function rebuildDecoder() {
  try {
    const fs = Cimbar.FS;
    const clean = (dir) => {
      let list = [];
      try { list = fs.readdir(dir); } catch (e) { return; }
      for (const n of list) {
        if (n !== '.' && n !== '..') { try { fs.unlink(dir + '/' + n); } catch (e) {} }
      }
    };
    clean('/out/');
    clean('/template_data/');
    try { fs.unlink('/temp'); } catch (e) {}
  } catch (e) {}
  decoder = createMTDecoder(Cimbar);
  bindDecoder(decoder);
}

/* ---------- 解码器初始化（主线程，无需 Worker） ---------- */
Cimbar.onRuntimeInitialized = () => {
  try {
    decoder = createMTDecoder(Cimbar);
    bindDecoder(decoder);
    btnScan.disabled = false;
    setMeta('readyMeta');
  } catch (e) {
    showErr(t('initFail') + ': ' + e);
  }
};
initCimbar(Cimbar, absUrl('./index.wasm'));
setTimeout(() => {
  if (!decoder) {
    showErr(t('initTimeout'));
    btnScan.disabled = true;
  }
}, 25000);

/* ---------- 扫描控制 ---------- */
function setScanState(on) {
  scanning = on;
  btnScan.disabled = on || !decoder;
  btnStop.disabled = !on;
  btnScan.textContent = on ? t('btnScanning') : (resultEl.children.length ? t('btnScanAgain') : t('btnScan'));
}
function scanLoop(ts) {
  if (!scanning) return;
  scanRaf = requestAnimationFrame(scanLoop);
  if (!decoder || !video.videoWidth) return;
  const ctx = scanCanvas.getContext('2d', { willReadFrequently: true });
  if (scanCanvas.width !== video.videoWidth) scanCanvas.width = video.videoWidth;
  if (scanCanvas.height !== video.videoHeight) scanCanvas.height = video.videoHeight;
  if (ts - lastDecodeAt > 45) {   // 约 20fps 解码节流，避免低端机满载
    lastDecodeAt = ts;
    try {
      ctx.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);
      decoder.decodeFrame(ctx.getImageData(0, 0, scanCanvas.width, scanCanvas.height));
      const pr = decoder.getProgress();
      progressBar.style.width = Math.round(pr * 100) + '%';
      if (pr > 0) setAlign('alignOk', true);
      setMeta('progressMeta', { p: Math.round(pr * 100) });
    } catch (e) { /* 单帧失败忽略 */ }
  }
}
async function startScan() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showErr(t('camErr', { msg: 'getUserMedia unavailable (HTTPS / localhost required)' }));
    setScanState(false);
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
    });
    streamRef = stream;
    video.srcObject = stream;
    await new Promise((res, rej) => {
      video.onloadedmetadata = res;
      video.onerror = rej;
    });
    video.play();
    setMeta('camOnMeta', { w: video.videoWidth, h: video.videoHeight });
    lastDecodeAt = 0;
    scanRaf = requestAnimationFrame(scanLoop);
  } catch (e) {
    showErr(t('camErr', { msg: (e && e.message ? e.message : e) }));
    setScanState(false);
  }
}
function stopScan() {
  cancelAnimationFrame(scanRaf);
  if (streamRef) { try { streamRef.getTracks().forEach((tr) => tr.stop()); } catch (e) {} streamRef = null; }
  video.srcObject = null;
}
btnScan.addEventListener('click', () => {
  if (!decoder || scanning) return;
  hideErr();
  progressBar.style.width = '0%';
  resultEl.innerHTML = '';
  lastRec = null;
  startScan();
  setScanState(true);
});
btnStop.addEventListener('click', () => {
  stopScan();
  setScanState(false);
  setMeta('stopped');
});

/* ---------- 静态图片解码（测试/截图接收） ---------- */
document.getElementById('imgFile').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f || !decoder) return;
  hideErr();
  resultEl.innerHTML = '';
  lastRec = null;
  setMeta('imgDecoding');
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    try {
      scanCanvas.width = img.naturalWidth;
      scanCanvas.height = img.naturalHeight;
      const ctx = scanCanvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      decoder.decodeFrame(ctx.getImageData(0, 0, scanCanvas.width, scanCanvas.height));
      setMeta('imgDecoded');
    } catch (err) {
      showErr(t('imgDecodeFail') + ': ' + (err && err.message ? err.message : err));
    } finally {
      URL.revokeObjectURL(url);
    }
  };
  img.onerror = () => { showErr(t('imgDecodeFail') + ': load error'); URL.revokeObjectURL(url); };
  img.src = url;
  e.target.value = '';
});

/* ---------- 语言切换时刷新动态文本 ---------- */
window.__onLangChange = () => {
  if (alignKey) setAlign(alignKey, alignOk);
  if (metaKey) setMeta(metaKey, metaVars);
  btnScan.textContent = scanning ? t('btnScanning') : (resultEl.children.length ? t('btnScanAgain') : t('btnScan'));
  if (lastRec) renderResult(lastRec);
  refreshList();
  refreshActiveTransfers();
};

/* ---------- 初始状态 ---------- */
setMeta('metaIdle');
setAlign('alignIdle', null);
if (typeof window.__onLangChange === 'function') window.__onLangChange();

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
refreshList();
refreshActiveTransfers();

/* 调试/测试句柄（无副作用，便于控制台验证协议与续传） */
window.__recv = {
  parseTransfer, handleSuccess, getTransfer, listTransfers, refreshActiveTransfers,
  isReady: () => !!decoder,
  getProgress: () => (decoder ? decoder.getProgress() : 0),
  rawProgress: () => (decoder ? decoder.rawProgress() : -1),
  outEntries: () => (decoder ? decoder.outEntries() : []),
  lastErr: () => (decoder ? decoder.lastErr : -1),
  lastTpls: () => (decoder ? decoder.lastTpls : -1),
  decodeDirect: (imgData) => { if (decoder) return decoder.decodeDirect(imgData); return null; },
  decodeStatic: (imgData) => { if (decoder) decoder.decodeFrame(imgData); },
};
</script>
</body>
