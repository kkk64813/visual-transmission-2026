<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Visual Transfer · Receiver</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #000; color: #eee;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  /* 全屏摄像头画面（官方 decoder 架构：video 铺满全屏，控件悬浮不遮挡画面） */
  #stage { position: fixed; inset: 0; z-index: 0; background: #000; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
  #scan { display: none; }
  /* 取景层：取景框 + 状态 + 进度，全部悬浮于视频之上 */
  #overlay { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #align {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    font-size: 12px; border-radius: 6px; padding: 4px 10px;
    background: rgba(0,0,0,.55); color: #aaa; white-space: nowrap;
  }
  #align.ok { background: rgba(47,125,79,.5); color: #7ee2a0; }
  #align.bad { background: rgba(200,60,50,.5); color: #ff9d94; }
  /* 目标取景框：QR 约占画面宽度 55%（方形 QR 高度=宽度，超过 16:9 画面高度会被上下裁切） */
  #frame {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 55%; aspect-ratio: 1/1; border: 2px dashed rgba(255,255,255,.4);
    border-radius: 8px; box-shadow: 0 0 0 4000px rgba(0,0,0,.15);
  }
  #frame::after {
    content: attr(data-hint); position: absolute; left: 50%; bottom: -34px; transform: translateX(-50%);
    font-size: 12px; color: rgba(255,255,255,.8); white-space: nowrap; pointer-events: none;
    text-shadow: 0 1px 2px #000;
  }
  #progressWrap {
    position: absolute; left: 10%; right: 10%; bottom: 100px; height: 6px;
    background: rgba(26,26,26,.7); border-radius: 3px; overflow: hidden;
  }
  #progressBar { height: 100%; width: 0; background: #ff6600; transition: width .15s; }
  #meta {
    position: absolute; left: 8%; right: 8%; bottom: 112px;
    font-size: 12px; color: #ccc; line-height: 1.5; text-align: center;
    text-shadow: 0 1px 2px #000;
  }
  /* 顶部半透明控制条 */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(0,0,0,.5); backdrop-filter: blur(4px);
  }
  #topbar a { color: #999; font-size: 13px; text-decoration: none; }
  #topbar .title { color: #ff6600; font-size: 14px; font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #topbar .tip { font-size: 11px; color: #888; display: none; }
  #langBtn {
    background: rgba(17,17,17,.8); color: #ff6600; border: 1px solid #333; border-radius: 6px;
    padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  #langBtn:hover { border-color: #ff6600; }
  /* 底部半透明控制条 */
  #controls {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
  }
  button, .btn, label.btn {
    background: rgba(17,17,17,.9); color: #ff6600; border: 1px solid #333; border-radius: 8px;
    padding: 10px 14px; font-size: 14px; cursor: pointer; display: inline-block;
  }
  button:hover, .btn:hover, label.btn:hover { border-color: #ff6600; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: #ff6600; color: #000; border-color: #ff6600; font-weight: 700; }
  .file-in { position: absolute; left: -9999px; }
  /* 结果：底部悬浮卡片（不挡取景） */
  #result {
    position: fixed; left: 10px; right: 10px; bottom: 66px; z-index: 30;
    max-height: 38%; overflow: auto; pointer-events: auto;
  }
  .card {
    background: rgba(13,13,13,.92); border: 1px solid #2a2a2a; border-radius: 10px;
    padding: 12px; margin-bottom: 10px;
  }
  .card .type { font-size: 12px; color: #ff6600; font-weight: 700; }
  .card .name { font-size: 14px; margin: 4px 0; word-break: break-all; }
  .card .size { font-size: 12px; color: #888; }
  .card .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .card img.preview { max-width: 100%; max-height: 200px; border-radius: 8px; display: block; margin: 8px 0; }
  .card pre {
    background: #000; border: 1px solid #222; border-radius: 6px; padding: 8px;
    font-size: 13px; max-height: 160px; overflow: auto; white-space: pre-wrap; word-break: break-all;
    color: #ddd; margin: 8px 0;
  }
  /* 错误提示：顶部悬浮 */
  #err {
    position: fixed; top: 58px; left: 50%; transform: translateX(-50%); z-index: 25;
    color: #ff9d94; font-size: 13px; padding: 6px 12px; border-radius: 8px;
    background: rgba(40,10,10,.9); display: none; max-width: 90%;
  }
  /* 历史记录：右侧抽屉 */
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(88vw, 420px);
    z-index: 40; background: rgba(8,8,8,.97); padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
    transform: translateX(105%); transition: transform .25s; overflow: auto;
  }
  #drawer.open { transform: none; }
  #drawer .drawer-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  #drawer .drawer-head span { flex: 1; color: #ff6600; font-weight: 700; font-size: 15px; }
  #drawer h2 { font-size: 14px; color: #ff6600; margin: 14px 0 8px; }
  #drawer ul { list-style: none; }
  #drawer li {
    display: flex; align-items: center; gap: 8px;
    background: #0d0d0d; border: 1px solid #222; border-radius: 8px;
    padding: 8px 10px; margin-bottom: 6px; font-size: 13px; flex-wrap: wrap;
  }
  #drawer .h-name { flex: 1; min-width: 100px; word-break: break-all; }
  #drawer .h-meta { color: #666; font-size: 12px; }
  #drawer a, #drawer button { font-size: 12px; padding: 4px 10px; }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline webkit-playsinline muted autoplay></video>
  <canvas id="scan" hidden></canvas>
</div>

<div id="overlay">
  <span id="align"></span>
  <div id="frame"></div>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div id="meta"></div>
</div>

<header id="topbar">
  <a href="./index.html" data-i18n="home">Home</a>
  <span class="title" data-i18n="title">Visual Transfer · Receiver</span>
  <span class="tip" data-i18n="tip">Add to Home Screen to use as an app</span>
  <button id="langBtn">中文</button>
</header>

<div id="controls">
  <button id="btnScan" class="primary" disabled data-i18n="btnScan">Start Scan</button>
  <button id="btnStop" disabled data-i18n="btnStop">Stop</button>
  <label class="btn" for="imgFile"><span data-i18n="testImg">Decode Image (test)</span></label>
  <input type="file" id="imgFile" class="file-in" accept="image/*" hidden>
  <button id="btnHistory" data-i18n="historyTitle">Received</button>
</div>

<div id="err"></div>
<div id="result"></div>

<div id="drawer">
  <div class="drawer-head">
    <span data-i18n="historyTitle">Received</span>
    <button id="btnDrawerClose">✕</button>
  </div>
  <div id="history">
    <h2 data-i18n="historyTitle">Received history</h2>
    <ul id="historyList"></ul>
  </div>
</div>

<script>
/* ---------- 官方 Cimbar 引擎（cimbar_js.wasm：编解码 + fountain + zstd 一体） ----------
   Module 必须定义在全局作用域，官方 loader 会复用并绑定 cimbard_* API。
   onRuntimeInitialized 的引擎就绪逻辑在下方主逻辑 IIFE 内定义（依赖其局部函数）。 */
var Module = {};
window.__CimbarModule = Module;
</script>
<script src="cimbar_js.2026-01-20T0312.js"></script>

<script>
(function () {
  const t = window.__t;

  const video = document.getElementById('video');
  const btnScan = document.getElementById('btnScan');
  const btnStop = document.getElementById('btnStop');
  const alignEl = document.getElementById('align');
  const progressBar = document.getElementById('progressBar');
  const metaEl = document.getElementById('meta');
  const errEl = document.getElementById('err');
  const resultEl = document.getElementById('result');
  const historyList = document.getElementById('historyList');

  let scanning = false;
  let streamRef = null;
  let lastReport = [];          // 官方进度报告（JSON 数组，元素=文件完成比例）
  let everGotData = false;
  let noDataSince = 0, noDataShown = false;   // 无进展提示计时
  let lastRec = null;           // 最近一次接收结果（语言切换时重绘）
  let metaKey = null, metaVars = null;
  let alignKey = null, alignOk = null;
  let lastDecodeAt = 0;

  /* ---------- 引擎就绪（官方 loader 在 wasm 初始化后调用） ---------- */
  Module.onRuntimeInitialized = function () {
    try {
      // 固定 4C 模式（发送端固定 4C）
      Module._cimbard_configure_decode(4);
      // 分配 fountain 缓冲
      var size = Module._cimbard_get_bufsize();
      window.__fountainBuf = new Uint8Array(Module.HEAPU8.buffer, Module._malloc(size), size);
      window.__engineReady = true;
      btnScan.disabled = false;
      setMeta('readyMeta');
      setAlign('alignIdle', null);
    } catch (e) {
      showErr(t('initFail') + ': ' + (e && e.message ? e.message : e));
    }
  };

  function showErr(msg) { errEl.style.display = 'block'; errEl.textContent = msg; }
  function hideErr() { errEl.style.display = 'none'; }
  function setMeta(key, vars) { metaKey = key; metaVars = vars || null; metaEl.textContent = t(key, vars); }
  function setAlign(key, ok) { alignKey = key; alignOk = ok || null; alignEl.className = ok ? 'ok' : (ok === false ? 'bad' : ''); alignEl.textContent = t(key); }
  function fmtSize(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1024).toFixed(1) + ' KB'; }
  function safeName(n) {
    return String(n || 'received').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').slice(0, 200) || 'received';
  }

  /* ---------- 官方解码 API 封装 ---------- */
  function getReport() {
    try {
      var errPtr = Module._malloc(2048);
      var elen = Module._cimbard_get_report(errPtr, 2048);
      if (elen > 0) {
        var view = new Uint8Array(Module.HEAPU8.buffer, errPtr, elen);
        var text = new TextDecoder().decode(view);
        Module._free(errPtr);
        try { return JSON.parse(text); } catch (e) { return text; }
      }
      Module._free(errPtr);
    } catch (e) {}
    return null;
  }

  /* 单帧解码：pixels(RGBA/NV12/I420) → 新块（null = 无新数据） */
  function decodePixels(pixels, format, width, height) {
    if (!window.__engineReady || !window.__fountainBuf) return null;
    var dataPtr = Module._malloc(pixels.length);
    Module.HEAPU8.set(pixels, dataPtr);
    var type = 4;
    if (format === 'NV12') type = 12;
    else if (format === 'I420') type = 420;
    var len = Module._cimbard_scan_extract_decode(dataPtr, width, height, type, window.__fountainBuf.byteOffset, window.__fountainBuf.length);
    Module._free(dataPtr);
    if (len <= 0) {
      var rep = getReport();
      if (rep && typeof rep === 'string' && rep.indexOf('imgdec:') >= 0) {
        // 扫描成功但无块：无进展（不弹错）
      }
      return null;
    }
    return new Uint8Array(Module.HEAPU8.buffer, window.__fountainBuf.byteOffset, len).slice();
  }

  /* Sink：聚合块 → 进度 → 完成重组 */
  function sink(buff) {
    if (!buff || buff.length === 0) return;
    var res = Module._cimbard_fountain_decode(buff.byteOffset, buff.length);
    var report = getReport();
    if (Array.isArray(report) && report.length > 0) {
      everGotData = true;
      noDataSince = 0;
      noDataShown = false;
      var p = Math.round(report[report.length - 1] * 100);
      progressBar.style.width = p + '%';
      setMeta('progressMeta', { p: p });
      lastReport = report;
    } else if (report && typeof report === 'string' && res > 0) {
      // 完成（report 可能是非 JSON 字符串）
    }
    if (res > 0) {
      var id = Number(BigInt.asUintN(32, BigInt(res)));
      reassembleFile(id);
    }
  }

  /* 完成：读文件名/大小 → 解压流 → Blob → 展示 */
  function reassembleFile(id) {
    try {
      var size = Number(Module._cimbard_get_filesize(id));
      var errPtr = Module._malloc(2048);
      var fnsize = Module._cimbard_get_filename(id, errPtr, 2048);
      var name = 'received-' + id + '-' + size;
      if (fnsize > 0) {
        name = new TextDecoder('utf-8').decode(new Uint8Array(Module.HEAPU8.buffer, errPtr, fnsize));
      }
      Module._free(errPtr);

      // 流式解压
      var bufSize = Module._cimbard_get_decompress_bufsize();
      var rptr = Module._malloc(bufSize);
      var chunks = [];
      for (;;) {
        var n = Module._cimbard_decompress_read(id, rptr, bufSize);
        if (n <= 0) break;
        chunks.push(new Uint8Array(Module.HEAPU8.buffer, rptr, n).slice());
      }
      Module._free(rptr);
      var blob = new Blob(chunks);
      finishTransfer(name, size, blob);
    } catch (e) {
      showErr('reassemble failed: ' + (e && e.message ? e.message : e));
    }
  }

  /* 完成展示：文本内联 + 图片预览 + 文件下载 */
  function finishTransfer(name, origSize, blob) {
    var lower = String(name).toLowerCase();
    var rec = { name: safeName(name), size: origSize, blob: blob, time: Date.now() };

    // 文本
    if (/(\.txt$|\.text$|\.md$|\.log$|\.json$|\.csv$|\.xml$|\.js$|\.py$|\.html$|\.css$)/.test(lower) || blob.size < 1024 * 1024) {
      blob.arrayBuffer().then(function (ab) {
        try {
          var text = new TextDecoder('utf-8').decode(ab);
          if (text.indexOf('\uFFFD') < 0) {
            rec.type = 1;
            rec.text = text;
            rec.kind = 'text';
          } else {
            rec.type = 0; rec.kind = 'file';
          }
        } catch (e) { rec.type = 0; rec.kind = 'file'; }
        renderRec(rec);
        saveHistory(rec);
      });
      return;
    }
    // 图片
    if (/\.(jpg|jpeg|png|gif|webp|bmp|avif)$/.test(lower)) {
      rec.type = 2; rec.kind = 'image';
      rec.dataUrl = URL.createObjectURL(blob);
      renderRec(rec);
      saveHistory(rec);
      return;
    }
    // 文件
    rec.type = 0; rec.kind = 'file';
    rec.dataUrl = URL.createObjectURL(blob);
    renderRec(rec);
    saveHistory(rec);
  }

  function typeLabel(rec) {
    if (rec.type === 1) return t('typeText');
    if (rec.type === 2) return t('typeImage');
    return t('typeFile');
  }

  function renderRec(rec) {
    lastRec = rec;
    var card = document.createElement('div');
    card.className = 'card';
    var html = '<div class="type">' + typeLabel(rec) + '</div>';
    html += '<div class="name">' + escapeHtml(rec.name) + '</div>';
    html += '<div class="size">' + fmtSize(rec.size || rec.blob.size) + '</div>';
    if (rec.kind === 'image' && rec.dataUrl) {
      html += '<img class="preview" src="' + rec.dataUrl + '">';
    } else if (rec.kind === 'text' && rec.text !== undefined) {
      html += '<pre>' + escapeHtml(rec.text.length > 4000 ? rec.text.slice(0, 4000) + '…' : rec.text) + '</pre>';
    }
    html += '<div class="acts">';
    if (rec.kind === 'text' && rec.text !== undefined) {
      html += '<button data-act="copy">' + t('copyText') + '</button>';
    }
    html += '<button data-act="save">' + (rec.kind === 'image' ? t('saveImage') : t('saveFile')) + '</button>';
    html += '</div>';
    card.innerHTML = html;
    card.querySelector('[data-act="copy"]')?.addEventListener('click', function () {
      try {
        navigator.clipboard.writeText(rec.text).then(function () {
          card.querySelector('[data-act="copy"]').textContent = t('copied');
        }, function () { card.querySelector('[data-act="copy"]').textContent = t('copyFail'); });
      } catch (e) { card.querySelector('[data-act="copy"]').textContent = t('copyFail'); }
    });
    card.querySelector('[data-act="save"]')?.addEventListener('click', function () {
      var a = document.createElement('a');
      a.href = rec.dataUrl || URL.createObjectURL(rec.blob);
      a.download = rec.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
    resultEl.prepend(card);
    // 完成后自动停止扫描，避免继续接收旧数据
    stopScan();
    btnScan.textContent = t('btnScanAgain');
    btnScan.disabled = false;
    btnStop.disabled = true;
    setMeta('recvDone', { name: rec.name, size: fmtSize(rec.size || rec.blob.size) });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---------- 历史记录（IndexedDB，刷新不丢） ---------- */
  let db = null;
  function openDB() {
    return new Promise(function (resolve) {
      if (db) { resolve(db); return; }
      try {
        var req = indexedDB.open('cimbar-recv', 1);
        req.onupgradeneeded = function () { req.result.createObjectStore('history', { keyPath: 'time' }); };
        req.onsuccess = function () { db = req.result; resolve(db); };
        req.onerror = function () { resolve(null); };
      } catch (e) { resolve(null); }
    });
  }
  function saveHistory(rec) {
    openDB().then(function (d) {
      if (!d) return;
      try {
        d.transaction('history', 'readwrite').objectStore('history').put({
          time: rec.time, name: rec.name, size: rec.size || rec.blob.size,
          type: rec.type, dataUrl: rec.dataUrl || null
        });
      } catch (e) {}
    });
  }
  function loadHistory() {
    openDB().then(function (d) {
      if (!d) return;
      try {
        var req = d.transaction('history').objectStore('history').getAll();
        req.onsuccess = function () {
          historyList.innerHTML = '';
          (req.result || []).sort(function (a, b) { return b.time - a.time; }).slice(0, 20).forEach(function (r) {
            var li = document.createElement('li');
            li.innerHTML = '<span class="h-name">' + escapeHtml(r.name) + '</span><span class="h-meta">' + fmtSize(r.size) + '</span>';
            historyList.appendChild(li);
          });
        };
      } catch (e) {}
    });
  }

  /* ---------- 摄像头与帧捕获（官方约束：优先 VideoFrame，兜底 canvas） ---------- */
  function startScan() {
    if (scanning) return;
    if (!window.__engineReady) { showErr(t('initTimeout')); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showErr(t('camErr', { msg: 'getUserMedia unavailable (HTTPS / localhost required)' }));
      return;
    }
    var constraints = {
      audio: false,
      video: {
        width: { min: 720, ideal: 1920 },
        height: { min: 720, ideal: 1080 },
        aspectRatio: matchMedia('all and (orientation:landscape)').matches ? 16 / 9 : 9 / 16,
        facingMode: 'environment',
        exposureMode: 'continuous',
        focusMode: 'continuous',
        frameRate: { ideal: 15 }
      }
    };
    navigator.mediaDevices.getUserMedia(constraints).then(function (stream) {
      streamRef = stream;
      scanning = true;
      video.srcObject = stream;
      btnScan.disabled = true;
      btnStop.disabled = false;
      setAlign('alignIdle', null);
      setMeta('camOnMeta', { w: video.videoWidth || '?', h: video.videoHeight || '?' });
      hideErr();
      progressBar.style.width = '0%';
      lastReport = [];
      everGotData = false;
      noDataSince = 0; noDataShown = false;
      video.play().catch(function () {});
      // 官方架构：requestVideoFrameCallback（真机手机支持良好；iOS 15+ 支持）
      if (typeof video.requestVideoFrameCallback === 'function') {
        video.requestVideoFrameCallback(onVideoFrame);
      } else {
        requestAnimationFrame(scanLoop);
      }
    }).catch(function (err) {
      showErr(t('camErr', { msg: err && err.message ? err.message : err }));
    });
  }

  function stopScan() {
    scanning = false;
    if (streamRef) {
      try { streamRef.getTracks().forEach(function (tr) { tr.stop(); }); } catch (e) {}
      streamRef = null;
    }
    video.srcObject = null;
    btnStop.disabled = true;
    btnScan.disabled = false;
    btnScan.textContent = t('btnScan');
    setAlign('alignIdle', null);
    setMeta('metaIdle');
  }

  /* VideoFrame 路径（官方）：每次新帧 → copyTo RGBA/NV12 → 解码 */
  let frameBusy = false;
  function onVideoFrame(now, metadata) {
    if (!scanning) return;
    if (frameBusy) { try { video.requestVideoFrameCallback(onVideoFrame); } catch (e) {} return; }
    frameBusy = true;
    try {
      var vf = new VideoFrame(video, { timestamp: now });
      var w = vf.displayWidth;
      var h = vf.displayHeight;
      var fmt = vf.format;
      var params = {};
      if (fmt !== 'NV12' && fmt !== 'I420' && fmt !== 'RGBA') {
        params.format = 'RGBA';
      }
      var size = vf.allocationSize(params);
      var buff = new Uint8Array(size);
      vf.copyTo(buff, params);
      vf.close();
      var format = params.format || fmt;
      var bytes = decodePixels(buff, format, w, h);
      if (bytes) sink(bytes);
      // 无进展提示（6 秒无新数据）
      noDataSince++;
      if (noDataSince > 60 && !noDataShown) {  // ~6 秒（15fps）
        noDataShown = true;
        setMeta('noProgressHint');
      }
    } catch (e) {
      // VideoFrame 不可用或失败 → 降级 canvas
      try {
        var c = document.getElementById('scan');
        c.width = video.videoWidth || 640;
        c.height = video.videoHeight || 480;
        var ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(video, 0, 0, c.width, c.height);
        var id = ctx.getImageData(0, 0, c.width, c.height);
        var bytes2 = decodePixels(new Uint8Array(id.data.buffer), 'RGBA', c.width, c.height);
        if (bytes2) sink(bytes2);
      } catch (e2) {}
    }
    frameBusy = false;
    try { video.requestVideoFrameCallback(onVideoFrame); } catch (e) {}
  }

  /* canvas 兜底路径（无 requestVideoFrameCallback 时） */
  function scanLoop(ts) {
    if (!scanning) return;
    if (ts - lastDecodeAt > 100) {
      lastDecodeAt = ts;
      var c = document.getElementById('scan');
      c.width = video.videoWidth || 640;
      c.height = video.videoHeight || 480;
      var ctx = c.getContext('2d', { willReadFrequently: true });
      try {
        ctx.drawImage(video, 0, 0, c.width, c.height);
        var id = ctx.getImageData(0, 0, c.width, c.height);
        var bytes = decodePixels(new Uint8Array(id.data.buffer), 'RGBA', c.width, c.height);
        if (bytes) sink(bytes);
      } catch (e) {}
    }
    requestAnimationFrame(scanLoop);
  }

  /* ---------- 静态图测试路径（Decode Image） ---------- */
  document.getElementById('imgFile').addEventListener('change', function (ev) {
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    setMeta('imgDecoding');
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var c = document.createElement('canvas');
        c.width = img.width; c.height = img.height;
        var ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);
        var id = ctx.getImageData(0, 0, c.width, c.height);
        var bytes = decodePixels(new Uint8Array(id.data.buffer), 'RGBA', c.width, c.height);
        if (bytes) {
          sink(bytes);
          // 静态图只给一次机会 → 重新配置解码器以便后续继续接收
          setTimeout(function () {
            try { Module._cimbard_configure_decode(4); } catch (e) {}
          }, 100);
        }
        setMeta('imgDecoded');
      };
      img.onerror = function () { setMeta('imgDecodeFail'); };
      img.src = URL.createObjectURL(file);
    };
    reader.readAsArrayBuffer(file);
    ev.target.value = '';
  });

  /* ---------- 事件绑定 ---------- */
  btnScan.addEventListener('click', function () {
    if (window.__engineReady) startScan();
    else showErr(t('initTimeout'));
  });
  btnStop.addEventListener('click', stopScan);

  document.getElementById('btnHistory').addEventListener('click', function () {
    document.getElementById('drawer').classList.add('open');
    loadHistory();
  });
  document.getElementById('btnDrawerClose').addEventListener('click', function () {
    document.getElementById('drawer').classList.remove('open');
  });

  window.addEventListener('resize', function () {});

  /* 语言切换时重绘最近结果 */
  window.__onLangChange = function () {
    if (metaKey) setMeta(metaKey, metaVars);
    if (alignKey) setAlign(alignKey, alignOk);
    if (lastRec) {
      resultEl.innerHTML = '';
      renderRec(lastRec);
    }
    loadHistory();
  };

  /* 测试/桥接 */
  window.__recv = {
    parseTransfer: function (u8) { return { name: 'official', size: u8.length }; },
    handleSuccess: function (name, size, blob) { finishTransfer(name, size, blob); },
    getProgress: function () {
      var p = 0;
      if (lastReport.length > 0) p = Math.round(lastReport[lastReport.length - 1] * 100);
      return p;
    },
    rawProgress: function () { return lastReport; },
    lastErr: function () { return null; },
    outEntries: function () { return resultEl.querySelectorAll('.card').length; },
    decodeDirect: function (imgData, w, h) {
      var bytes = decodePixels(new Uint8Array(imgData.data ? imgData.data.buffer : imgData), 'RGBA', w, h);
      return bytes ? bytes.length : 0;
    },
    decodeStatic: function (imgData, w, h) {
      var before = window.__engineReady;
      try { Module._cimbard_configure_decode(4); } catch (e) {}
      var bytes = decodePixels(new Uint8Array(imgData.data ? imgData.data.buffer : imgData), 'RGBA', w, h);
      return { got: bytes ? bytes.length : 0 };
    },
    isReady: function () { return !!window.__engineReady; },
    reset: function () { try { Module._cimbard_configure_decode(4); } catch (e) {} }
  };
})();
</script>
</body>
</html>
