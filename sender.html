<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Visual Transfer · Sender</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#000000">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #000;
    color: #ff6600;
    font-family: "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
  }
  header {
    width: 100%;
    max-width: 860px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  header a { color: #888; font-size: 13px; text-decoration: none; }
  header a:hover { color: #ff6600; }
  .ctrl { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  select, button, .tab {
    background: #111; color: #ff6600; border: 1px solid #333;
    border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  select:focus, button:focus, .tab:focus { outline: 1px solid #ff6600; }
  button:hover, .tab:hover { border-color: #ff6600; }
  .tabs { display: flex; gap: 8px; margin-bottom: 10px; }
  .tab.active { background: #ff6600; color: #000; border-color: #ff6600; font-weight: 700; }
  .panel {
    width: 100%;
    max-width: 860px;
    background: #0a0a0a;
    border: 1px solid #222;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .panel[hidden] { display: none; }
  #dropzone {
    border: 2px dashed #333; border-radius: 8px;
    padding: 26px 12px; text-align: center; color: #888; cursor: pointer;
    transition: border-color .2s;
  }
  #dropzone.over { border-color: #ff6600; color: #ff6600; }
  textarea {
    width: 100%; min-height: 96px; resize: vertical;
    background: #000; color: #eee; border: 1px solid #333; border-radius: 6px;
    padding: 8px; font-size: 14px; font-family: inherit;
  }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .muted { color: #777; font-size: 12px; }
  #imgPreview { max-width: 160px; max-height: 120px; border-radius: 6px; display: none; border: 1px solid #333; }
  #imgPreview[src] { display: block; }
  #cimbar {
    width: 100%; max-width: 860px;
    border: 1px solid #222; border-radius: 10px; background: #000;
  }
  #status {
    width: 100%; max-width: 860px;
    min-height: 20px;
    font-size: 12px; color: #888; margin-top: 8px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-all;
  }
  #badge {
    display: none; background: #ff6600; color: #000;
    font-size: 12px; font-weight: 700; border-radius: 4px; padding: 2px 8px;
  }
  #badge.on { display: inline-block; }
</style>
</head>
<body>

<header>
  <a href="./index.html" data-i18n="home">首页</a>
  <h1 data-i18n="title">视觉传输 · 发送端</h1>
  <div class="ctrl">
    <span class="muted" data-i18n="fpsLabel">帧率</span>
    <select id="fps" data-i18n-title="fpsHint">
      <option value="15">15 fps</option>
      <option value="20">20 fps</option>
      <option value="30">30 fps</option>
    </select>
    <button id="btnPause" data-i18n="pause">暂停</button>
    <button id="btnFull" data-i18n="fullscreen">全屏</button>
    <button id="langBtn">中文</button>
    <span id="badge" data-i18n="transmitting">传输中</span>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="file" data-i18n="tabFile">文件</button>
  <button class="tab" data-tab="text" data-i18n="tabText">文本</button>
  <button class="tab" data-tab="image" data-i18n="tabImage">图片</button>
</div>

<div class="panel" id="panel-file">
  <div id="dropzone">
    <span data-i18n="dropHint">拖放文件到这里，或点击选择文件</span>
    <input type="file" id="fileInput" hidden>
  </div>
  <div class="muted" style="margin-top:8px" data-i18n="sizeHint">大文件建议 ≤ 30MB；文件越大，扫描耗时越长。</div>
</div>

<div class="panel" id="panel-text" hidden>
  <textarea id="txt" data-i18n-ph="txtPlaceholder" placeholder="粘贴或输入要传输的文字…"></textarea>
  <div class="row">
    <button id="btnSendText" data-i18n="btnSendText">开始传输文本</button>
    <span class="muted" id="textInfo"></span>
  </div>
</div>

<div class="panel" id="panel-image" hidden>
  <div class="row">
    <button id="btnPickImg" data-i18n="btnPickImg">选择图片</button>
    <input type="file" id="imgInput" accept="image/*" hidden>
    <span class="muted" data-i18n="dragHint">支持拖入 / 粘贴（Ctrl+V）</span>
  </div>
  <div class="row">
    <img id="imgPreview" alt="preview">
    <div>
      <div class="muted" id="imgInfo"></div>
      <button id="btnSendImg" style="margin-top:6px" disabled data-i18n="btnSendImg">开始传输图片</button>
    </div>
  </div>
</div>

<canvas id="cimbar"></canvas>

<div id="status"></div>

<script>
/* ---------- i18n：默认英文，可切换中文，选择本地记住 ---------- */
(function () {
  var LANG_KEY = 'cimbar-lang';
  var I18N = {
    en: {
      title: 'Visual Transfer · Sender',
      home: 'Home',
      fpsLabel: 'Frame rate',
      fpsHint: 'Encoding animation refresh rate (higher is better if the decoder keeps up)',
      pause: 'Pause',
      resume: 'Resume',
      fullscreen: 'Fullscreen',
      transmitting: 'Transmitting',
      tabFile: 'File',
      tabText: 'Text',
      tabImage: 'Image',
      dropHint: 'Drop files here, or click to choose',
      sizeHint: 'Large files: ≤ 30 MB recommended; bigger files take longer to scan.',
      txtPlaceholder: 'Paste or type the text to transfer…',
      btnSendText: 'Send Text',
      btnPickImg: 'Choose Image',
      dragHint: 'Drag & drop or paste (Ctrl+V) supported',
      btnSendImg: 'Send Image',
      initWait: 'Initializing…',
      libNotReady: 'Decoder library not ready yet, please wait…',
      typeFile: 'File',
      typeText: 'Text',
      typeImage: 'Image',
      statusStart: 'Type: {type}\nName: {name}\nData: {size} KB (incl. header)\nEst. frames: {frames} frames, about {sec}s @ {fps}fps (estimate)\nTip: keep the screen bright and steady; point the phone camera at the whole animation',
      encodeFail: 'Encode failed',
      framesRendered: 'Rendered frames: {n}',
      ready: 'Ready: pick a file / text / image to start.',
      initFail: 'Initialization failed',
      initTimeout: 'Initialization failed or still loading… Open via HTTPS or localhost (file:// cannot load WASM).',
      kb: 'KB',
      textFileName: 'text.txt',
      imgInfo: 'Original {orig} KB → compressed {now} KB (max side 1600px, JPEG 0.85)',
      imgFail: 'Image processing failed',
      imgReadFail: 'Failed to read image',
      imageName: 'Image',
      httpsWarn: 'Note: not on HTTPS/localhost — the receiver camera will be unavailable. Deploy to GitHub Pages first.'
    },
    zh: {
      title: '视觉传输 · 发送端',
      home: '首页',
      fpsLabel: '帧率',
      fpsHint: '编码动画刷新帧率（解码端越快越稳则越高）',
      pause: '暂停',
      resume: '继续',
      fullscreen: '全屏',
      transmitting: '传输中',
      tabFile: '文件',
      tabText: '文本',
      tabImage: '图片',
      dropHint: '拖放文件到这里，或点击选择文件',
      sizeHint: '大文件建议 ≤ 30MB；文件越大，扫描耗时越长。',
      txtPlaceholder: '粘贴或输入要传输的文字…',
      btnSendText: '开始传输文本',
      btnPickImg: '选择图片',
      dragHint: '支持拖入 / 粘贴（Ctrl+V）',
      btnSendImg: '开始传输图片',
      initWait: '等待初始化…',
      libNotReady: '解码库尚未就绪，请稍候…',
      typeFile: '文件',
      typeText: '文本',
      typeImage: '图片',
      statusStart: '类型: {type}\n名称: {name}\n数据量: {size} KB（含头部）\n预计帧数: {frames} 帧，约 {sec} 秒 @ {fps}fps（估算）\n提示: 保持屏幕全亮度、画面稳定，让手机摄像头对准整个编码画面',
      encodeFail: '编码失败',
      framesRendered: '已渲染帧: {n}',
      ready: '就绪：选择文件 / 文本 / 图片后开始传输。',
      initFail: '初始化失败',
      initTimeout: '初始化失败或仍在加载… 请确认通过 HTTPS 或 localhost 打开（file:// 无法加载 WASM）。',
      kb: 'KB',
      textFileName: '文本.txt',
      imgInfo: '原 {orig} KB → 压缩后 {now} KB（最长边 1600px, JPEG 0.85）',
      imgFail: '图片处理失败',
      imgReadFail: '图片读取失败',
      imageName: '图片',
      httpsWarn: '注意：当前非 HTTPS/localhost 环境，接收端摄像头将不可用。请部署到 GitHub Pages 后使用。'
    }
  };
  var lang = 'en';
  try { var saved = localStorage.getItem(LANG_KEY); if (saved && I18N[saved]) lang = saved; } catch (e) {}
  function t(key, vars) {
    var s = (I18N[lang] && I18N[lang][key]) || key;
    if (vars) { for (var k in vars) { s = s.split('{' + k + '}').join(String(vars[k])); } }
    return s;
  }
  function applyLang() {
    document.documentElement.lang = (lang === 'zh') ? 'zh-CN' : 'en';
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
      el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph')));
    });
    document.querySelectorAll('[data-i18n-title]').forEach(function (el) {
      el.setAttribute('title', t(el.getAttribute('data-i18n-title')));
    });
    document.getElementById('langBtn').textContent = (lang === 'en') ? '中文' : 'English';
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  }
  document.getElementById('langBtn').addEventListener('click', function () {
    lang = (lang === 'en') ? 'zh' : 'en';
    applyLang();
    if (window.__onLangChange) window.__onLangChange();
  });
  applyLang();
})();
</script>

<script type="module">
import { Encoder, initCimbar } from './index.js';

const t = window.__t;

const TYPE_FILE = 0, TYPE_TEXT = 1, TYPE_IMAGE = 2;
const canvas = document.getElementById('cimbar');
const statusEl = document.getElementById('status');
const badge = document.getElementById('badge');

const Cimbar = {};
let encoder = null;
let fps = 15;
let framesRendered = 0;
let paused = false;
let pendingImage = null;   // { bytes, name }
let transferInfo = null;   // { type, name, sizeKB, estFrames, estSec }
let statusMsg = null;      // { key, vars } 或 { plain }
let lastImgInfo = null;    // { orig, now }

function absUrl(p) { return new URL(p, location.href).href; }

function setStatusT(key, vars) {
  statusMsg = { key: key, vars: vars || null };
  statusEl.textContent = t(key, vars);
}
function setStatusP(text) {
  statusMsg = { plain: text };
  statusEl.textContent = text;
}
function renderStatus() {
  const ti = transferInfo;
  const typeName = ti.type === TYPE_TEXT ? t('typeText') : ti.type === TYPE_IMAGE ? t('typeImage') : t('typeFile');
  statusEl.textContent = t('statusStart', {
    type: typeName,
    name: ti.name,
    size: ti.sizeKB.toFixed(1),
    frames: ti.estFrames,
    sec: ti.estSec,
    fps: fps
  }) + '\n' + t('framesRendered', { n: framesRendered });
}

/* ---------- CTXF 头部封装 ---------- */
// 数据格式: "CTXF" + version(1) + type(1) + flags(1) + nameLen(2LE) + payloadLen(4LE) + name + payload
function buildTransfer(type, name, payload) {
  const te = new TextEncoder();
  const nameBytes = te.encode(String(name || 'untitled').slice(0, 200));
  const h = new Uint8Array(13);
  h[0] = 0x43; h[1] = 0x54; h[2] = 0x58; h[3] = 0x46; // CTXF
  h[4] = 1;                 // version
  h[5] = type;              // 0 文件 / 1 文本 / 2 图片
  h[6] = 0;                 // flags（预留压缩位）
  h[7] = nameBytes.length & 0xff;
  h[8] = (nameBytes.length >> 8) & 0xff;
  h[9] = payload.length & 0xff;
  h[10] = (payload.length >> 8) & 0xff;
  h[11] = (payload.length >> 16) & 0xff;
  h[12] = (payload.length >> 24) & 0xff;
  const out = new Uint8Array(h.length + nameBytes.length + payload.length);
  out.set(h, 0);
  out.set(nameBytes, h.length);
  out.set(payload, h.length + nameBytes.length);
  return out;
}

/* ---------- 编码启动 ---------- */
function startTransfer(type, name, bytes) {
  if (!encoder) { setStatusT('libNotReady'); return; }
  const u8 = buildTransfer(type, name, bytes);
  const file = new File([u8], 'transfer.bin', { type: 'application/octet-stream' });
  framesRendered = 0;
  const estFrames = Math.ceil(u8.length / 7500); // B 模式单帧约 7.5KB（估算）
  const estSec = Math.ceil(estFrames / fps);
  transferInfo = { type: type, name: name, sizeKB: u8.length / 1024, estFrames: estFrames, estSec: estSec };
  badge.classList.add('on');
  renderStatus();
  try { encoder.encode(file); } catch (e) { setStatusT('encodeFail'); setStatusP(t('encodeFail') + ': ' + e); }
  keepAwake();
}

/* ---------- 防熄屏 ---------- */
let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { /* 忽略：部分浏览器不支持 */ }
}

/* ---------- 运行时初始化 ---------- */
Cimbar.onRuntimeInitialized = () => {
  try {
    encoder = new Encoder(Cimbar, canvas);
    encoder.onFrame = () => {
      framesRendered += 1;
      if (transferInfo) renderStatus();
    };
    setStatusT('ready');
  } catch (e) {
    setStatusT('initFail');
    setStatusP(t('initFail') + ': ' + e);
  }
};
initCimbar(Cimbar, absUrl('./index.wasm'));
setTimeout(() => {
  if (!encoder) {
    setStatusT('initTimeout');
    document.getElementById('btnPause').textContent = t('pause');
  }
}, 12000);

/* ---------- 帧率 / 暂停 / 全屏 ---------- */
document.getElementById('fps').addEventListener('change', (e) => {
  fps = parseInt(e.target.value, 10) || 15;
  if (encoder && typeof encoder.interval === 'number') {
    encoder.interval = Math.round(1000 / fps); // 兼容：interval 以毫秒计
  }
  if (transferInfo) renderStatus();
});
document.getElementById('btnPause').addEventListener('click', () => {
  if (!encoder) return;
  paused = !paused;
  try { encoder.togglePause(paused); } catch (e) {}
  document.getElementById('btnPause').textContent = t(paused ? 'resume' : 'pause');
});
document.getElementById('btnFull').addEventListener('click', () => {
  if (document.fullscreenElement) { document.exitFullscreen(); }
  else { document.documentElement.requestFullscreen().catch(() => {}); }
});

/* ---------- 页签 ---------- */
document.querySelectorAll('.tab').forEach((tab) => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
    tab.classList.add('active');
    ['file', 'text', 'image'].forEach((k) => {
      document.getElementById('panel-' + k).hidden = (k !== tab.dataset.tab);
    });
  });
});

/* ---------- 文件 ---------- */
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault(); dropzone.classList.remove('over');
  if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    startTransfer(TYPE_FILE, file.name, new Uint8Array(reader.result));
  };
  reader.readAsArrayBuffer(file);
}

/* ---------- 文本 ---------- */
document.getElementById('btnSendText').addEventListener('click', () => {
  const txt = document.getElementById('txt').value;
  if (!txt.trim()) return;
  const bytes = new TextEncoder().encode(txt);
  document.getElementById('textInfo').textContent = (bytes.length / 1024).toFixed(1) + ' ' + t('kb');
  startTransfer(TYPE_TEXT, t('textFileName'), bytes);
});

/* ---------- 图片 ---------- */
const imgInput = document.getElementById('imgInput');
const imgInfoEl = document.getElementById('imgInfo');
document.getElementById('btnPickImg').addEventListener('click', () => imgInput.click());
imgInput.addEventListener('change', () => { if (imgInput.files[0]) handleImage(imgInput.files[0]); });

document.addEventListener('paste', (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const it of items) {
    if (it.type && it.type.indexOf('image') === 0) {
      handleImage(it.getAsFile());
      break;
    }
  }
});

async function handleImage(blob) {
  try {
    const bytes = await compressImage(blob, 1600, 0.85);
    pendingImage = { bytes, name: (blob.name && blob.name.replace(/\.[^.]+$/, '') || t('imageName')) + '.jpg' };
    const url = URL.createObjectURL(new Blob([bytes], { type: 'image/jpeg' }));
    const preview = document.getElementById('imgPreview');
    preview.src = url;
    const orig = (blob.size / 1024).toFixed(1);
    const now = (bytes.length / 1024).toFixed(1);
    lastImgInfo = { orig: orig, now: now };
    imgInfoEl.textContent = t('imgInfo', lastImgInfo);
    document.getElementById('btnSendImg').disabled = false;
  } catch (e) {
    imgInfoEl.textContent = t('imgFail') + ': ' + e;
  }
}

async function compressImage(blob, maxDim, quality) {
  const url = URL.createObjectURL(blob);
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error(t('imgReadFail')));
    i.src = url;
  });
  let w = img.naturalWidth, h = img.naturalHeight;
  const scale = Math.min(1, maxDim / Math.max(w, h));
  w = Math.max(1, Math.round(w * scale));
  h = Math.max(1, Math.round(h * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  URL.revokeObjectURL(url);
  const out = await new Promise((res) => c.toBlob(res, 'image/jpeg', quality));
  return new Uint8Array(await out.arrayBuffer());
}

document.getElementById('btnSendImg').addEventListener('click', () => {
  if (pendingImage) startTransfer(TYPE_IMAGE, pendingImage.name, pendingImage.bytes);
});

/* ---------- 语言切换时刷新动态文本 ---------- */
window.__onLangChange = () => {
  if (transferInfo) { renderStatus(); }
  else if (statusMsg) { statusEl.textContent = statusMsg.key ? t(statusMsg.key, statusMsg.vars) : statusMsg.plain; }
  document.getElementById('btnPause').textContent = t(paused ? 'resume' : 'pause');
  if (lastImgInfo) { imgInfoEl.textContent = t('imgInfo', lastImgInfo); }
};

/* ---------- 初始状态 ---------- */
statusEl.textContent = t('initWait');
if (typeof window.__onLangChange === 'function') window.__onLangChange();

/* ---------- 入口页跳转提示 ---------- */
if (!location.protocol.startsWith('https') && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
  setStatusT('httpsWarn');
}
</script>
</body>
</html>
